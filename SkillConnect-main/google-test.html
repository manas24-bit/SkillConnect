<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Test</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h1>🔧 Google Login Test</h1>
    <p><strong>Support Email:</strong> gaurav.pawar1906@gmail.com</p>
    <p><strong>Current URL:</strong> <span id="url"></span></p>
    <p><strong>Domain:</strong> <span id="domain"></span></p>
    
    <button onclick="testLogin()" style="padding: 10px 20px; font-size: 16px; margin: 10px;">
        Test Google Login
    </button>
    
    <div id="result" style="margin-top: 20px; padding: 15px; border-radius: 5px;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider 
        } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";

        // Display current URL and domain
        const currentUrl = window.location.href;
        const currentDomain = window.location.hostname;
        
        document.getElementById('url').textContent = currentUrl;
        document.getElementById('domain').textContent = currentDomain;

        const firebaseConfig = {
            apiKey: "AIzaSyDOb9wgBLl70cT4KN9f0YGUsE_7_bQyNT8",
            authDomain: "skill-connect-app-ef1a8.firebaseapp.com",
            projectId: "skill-connect-app-ef1a8",
            storageBucket: "skill-connect-app-ef1a8.firebasestorage.app",
            messagingSenderId: "977454966441",
            appId: "1:977454966441:web:2669120f8f1e9dc134abb8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.testLogin = async function() {
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.innerHTML = '<div style="color: blue;">🔄 Starting Google login...</div>';
                console.log('Testing Google login from domain:', currentDomain);
                
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                resultDiv.innerHTML = `
                    <div style="color: green; background: #f0fff0; padding: 15px; border-radius: 5px;">
                        ✅ <strong>SUCCESS!</strong><br>
                        Welcome: ${user.displayName}<br>
                        Email: ${user.email}<br>
                        Domain: ${currentDomain}
                    </div>
                `;
                console.log('Success:', user);
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div style="color: red; background: #fff0f0; padding: 15px; border-radius: 5px;">
                        ❌ <strong>ERROR:</strong> ${error.message}<br>
                        <strong>Code:</strong> ${error.code}<br>
                        <strong>Current Domain:</strong> ${currentDomain}<br><br>
                        <strong>Solution:</strong> Add "${currentDomain}" to Firebase Authorized Domains
                    </div>
                `;
                console.error('Error:', error);
            }
        };
    </script>
</body>
</html>
